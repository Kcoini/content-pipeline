# 수익형 블로그형(monetized_blog) 품질 평가 기준 - Phase 2-1
#
# lib/ai/eval-article.ts의 evaluateModeArticleWithAi/evaluateModeArticleMock가
# article_mode='monetized_blog'인 기사에 대해 이 기준으로 평가한다.
# 이 평가는 사람의 검토(human_review)를 대체하지 않으며, 참고 자료로만 제공된다.

name: monetized-blog.eval
version: 1
target: article
description: >
  수익형 블로그 초안의 품질을 검색 의도 적합성, 클릭 가능성, 과장/허위 여부,
  체류시간 구조, 요약/비교/체크리스트/FAQ 요소, 내부 링크, 광고 슬롯 위치,
  AdSense 정책 위험도 관점에서 평가한다.

model:
  provider: anthropic
  name: claude-sonnet-4-6

criteria:
  - id: search-intent-fit
    description: 제목/본문이 타깃 키워드의 검색 의도(정보성/거래성 등)에 부합하는가
    weight: 0.12
    scale: 1-5
    pass_threshold: 3

  - id: title-clickability
    description: 제목이 클릭베이트 없이도 클릭을 유도할 만큼 매력적인가
    weight: 0.08
    scale: 1-5
    pass_threshold: 3

  - id: exaggeration-check
    description: 과장/허위 수익 약속, 클릭베이트 표현이 없는가 (1=심각, 5=없음)
    weight: 0.12
    scale: 1-5
    pass_threshold: 3

  - id: dwell-time-structure
    description: 목차, 소제목, 단락 구성이 체류시간을 늘리는 구조인가
    weight: 0.10
    scale: 1-5
    pass_threshold: 3

  - id: summary-box
    description: 핵심 요약 박스가 명확하고 유용한가
    weight: 0.08
    scale: 1-5
    pass_threshold: 3

  - id: comparison-checklist
    description: 비교표와 체크리스트가 실질적인 정보를 제공하는가
    weight: 0.10
    scale: 1-5
    pass_threshold: 3

  - id: faq-quality
    description: FAQ가 독자의 실제 질문을 반영하고 정확한가
    weight: 0.08
    scale: 1-5
    pass_threshold: 3

  - id: internal-link-suggestions
    description: 내부 링크 추천이 주제와 관련성이 높고 전환에 도움이 되는가
    weight: 0.07
    scale: 1-5
    pass_threshold: 3

  - id: ad-slot-placement
    description: AD_SLOT marker 위치가 가독성을 해치지 않고 적절한가
    weight: 0.07
    scale: 1-5
    pass_threshold: 3

  - id: adsense-policy-risk
    description: >
      AdSense 정책 위반 소지(허위 수익 약속, 클릭 유도 문구, 선정적 제목,
      고위험 단정, 출처 없는 주장, 복사/저작권 위험)가 있는가.
      (1=위험 없음, 5=심각한 위험 — 점수가 높을수록 위험. 가중 평균에는 포함하되
      gate로도 사용한다.)
    weight: 0.18
    scale: 1-5
    pass_threshold: 3

  # ── "문제 해결형 수익 블로그" 개선: E-E-A-T / AEO / GEO / YMYL 기준 추가 ──

  - id: eeat-trustworthiness
    description: >
      허위 경험담, 허위 사용 후기, 허위 전문가 검토, 출처 없는 단정적 주장이
      없는가. 독자가 스스로 판단할 수 있도록 비교 기준·주의점·한계를
      제시하는가. (1=신뢰성 근거 없음/허위 표현 의심, 5=근거가 명확하고
      한계도 함께 제시함). 가중 평균에 포함되며, 낮은 점수는 별도 gate로도
      사용한다(eeat_trustworthiness_min_threshold).
    weight: 0.12
    scale: 1-5
    pass_threshold: 3

  - id: answer-summary-quality
    description: >
      글 상단의 answerSummary(직접 답변)가 독자의 핵심 질문에 명확하고
      간결하게 답하는가. 과도하게 단정적이지 않고, 본문의 결론과
      충돌하지 않는가.
    weight: 0.06
    scale: 1-5
    pass_threshold: 3

  - id: geo-clarity
    description: >
      각 섹션이 독립적으로 읽어도 의미가 통하는가. 결론을 먼저 제시하고
      근거·예외를 뒤에 설명하는가. AI 요약에 잘못 인용될 만한 과장문이나
      검색/AI 노출을 보장하는 표현이 없는가.
    weight: 0.05
    scale: 1-5
    pass_threshold: 3

  - id: keyword-naturalness
    description: >
      targetKeyword와 secondaryKeywords가 문맥에 자연스럽게 쓰였는가.
      키워드 반복(keyword stuffing)이나 부자연스러운 삽입이 없는가.
    weight: 0.05
    scale: 1-5
    pass_threshold: 3

  - id: ymyl-risk
    description: >
      의료/금융/법률/안전/공공정책 등 고위험(YMYL) 주제에서 단정적
      조언을 하지 않는가. (1=위험 없음, 5=단정적 조언으로 위험함 —
      점수가 높을수록 위험. 가중 평균에는 포함하되 gate로도 사용한다.)
    weight: 0.10
    scale: 1-5
    pass_threshold: 3

scoring:
  aggregate: weighted_average
  pass_threshold: 3.0
  # adsense-policy-risk >= 4이면 passed=false 강제 (가중 평균과 무관)
  policy_risk_fail_threshold: 4
  # eeat-trustworthiness < 3이면 passed=false 강제 (가중 평균과 무관)
  eeat_trustworthiness_min_threshold: 3
  # ymyl-risk >= 4이면 passed=false 강제 (가중 평균과 무관)
  ymyl_risk_fail_threshold: 4

output:
  format: json
  fields:
    - criteria_scores
    - aggregate_score
    - passed
    - notes
